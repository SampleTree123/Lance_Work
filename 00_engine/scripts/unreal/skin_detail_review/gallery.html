<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>皮肤细节对照</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#171b22;color:#e9edf5}body{max-width:1550px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 12px}p{color:#bcc7d6;line-height:1.7}header{border-bottom:1px solid #3a4455;padding-bottom:15px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}select,button{background:#293445;color:#fff;border:1px solid #627187;padding:10px 14px;border-radius:6px;font:inherit}button{cursor:pointer}button:hover{background:#3c506b}label{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{border:1px solid #3a4455;border-radius:9px;padding:14px;min-width:0}video,.still{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#080a0e}.pending{display:flex;align-items:center;justify-content:center;min-height:250px;background:#222935;color:#b7c7dc}.pending[hidden]{display:none}.reference{display:flex;gap:20px;align-items:flex-start;margin-top:24px;padding:18px;background:#212a37}.reference img{max-width:240px;max-height:310px;object-fit:contain}.detail{font-size:14px;color:#b7c7dc;word-break:break-word}.seek{flex:1;min-width:200px}#notice{color:#e2be75}h2{font-size:18px;margin-top:0}a{color:#a7ceff}canvas{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.reference{flex-direction:column}}
[hidden]{display:none!important}
</style>
<header><h1>皮肤细节 · 同条件对照</h1><p>选角色与取景，再选择左右版本。A 保留原始皮肤；B 补回原角色的粗糙度贴图；C 使用整套候选皮肤。微法线版仅供诊断。左右画面使用同一时间，点击“静帧”可放大观察。</p><div id="status"></div></header>
<div class="toolbar"><label>角色<select id="character"></select></label><label>取景<select id="framing"><option value="head">面部近景</option><option value="upper">上半身</option></select></label><button id="play">同步播放</button><button id="pause">暂停</button><button id="reset">回到开头</button><label><input id="loop" type="checkbox" checked>循环</label><input id="seek" class="seek" aria-label="同步时间" type="range" min="0" max="9.9666667" step="0.033333333" value="0"><span id="time">0.00s</span></div>
<div id="notice" aria-live="polite"></div><div class="grid"><article id="left"><h2>左侧 <select aria-label="左侧版本"></select></h2><video muted playsinline preload="metadata"></video><div class="pending" hidden></div><div class="toolbar"><button class="freeze">静帧</button><button class="back" hidden>返回视频</button><a class="download" hidden download>保存静帧</a></div><img class="still" hidden alt="当前时间原尺寸静帧"><div class="detail"></div></article><article id="right"><h2>右侧 <select aria-label="右侧版本"></select></h2><video muted playsinline preload="metadata"></video><div class="pending" hidden></div><div class="toolbar"><button class="freeze">静帧</button><button class="back" hidden>返回视频</button><a class="download" hidden download>保存静帧</a></div><img class="still" hidden alt="当前时间原尺寸静帧"><div class="detail"></div></article></div>
<div class="reference"><img id="photo" alt="角色源照片"><div><h2>源照片与观察重点</h2><p>比较毛孔和细纹是否自然、额鼻与脸颊反光、嘴唇及眼周过渡，以及头颈接缝。照片与渲染光照不同，不宜只凭整体亮度判断肤色是否一致。</p><p id="identity"></p><p>当前页面不代表最终视觉验收。缺失或未核验的媒体明确标为待完成。</p></div></div>
<script>
const DATA=__DATA__;
const $=s=>document.querySelector(s), sides=[$('#left'),$('#right')], videos=sides.map(x=>x.querySelector('video'));
let activeRows=[],playing=false,syncToken=0;
function option(value,text){const o=document.createElement('option');o.value=value;o.textContent=text;return o}
DATA.characters.forEach(x=>$('#character').append(option(x.id,(x.sex==='female'?'女性':'男性')+' · '+x.id)));
sides.forEach(s=>DATA.variants.forEach(x=>s.querySelector('select').append(option(x.id,x.label))));
sides[0].querySelector('select').value='A';sides[1].querySelector('select').value=DATA.clips.some(x=>x.variant==='C'&&x.playable)?'C':'B';
$('#status').textContent=`已核验 ${DATA.playable_count} / ${DATA.clips.filter(x=>x.status!=='not_planned').length} 个片段 · 1920 × 1080 · 30 fps · 每段 10 秒`;
function pause(){playing=false;syncToken++;videos.forEach(v=>v.pause())}
function seek(t){videos.forEach(v=>{if(v.readyState>=1)v.currentTime=Math.min(t,9.9666667)});$('#seek').value=t;$('#time').textContent=Number(t).toFixed(2)+'s'}
function refresh(){pause();$('#notice').textContent='';activeRows=[];const ch=DATA.characters.find(x=>x.id===$('#character').value);$('#identity').textContent=ch.id;$('#photo').hidden=!ch.photo_url;if(ch.photo_url)$('#photo').src=ch.photo_url;
sides.forEach((s,i)=>{const row=DATA.clips.find(x=>x.character_id===ch.id&&x.framing===$('#framing').value&&x.variant===s.querySelector('select').value);activeRows[i]=row;const v=videos[i],p=s.querySelector('.pending');v.pause();v.removeAttribute('src');v.load();v.hidden=!row?.playable;p.hidden=!!row?.playable;s.querySelector('.still').hidden=true;s.querySelector('.back').hidden=true;s.querySelector('.download').hidden=true;s.querySelector('.freeze').disabled=!row?.playable;
if(row?.playable){v.src=row.video_url;v.poster=row.poster_url||'';s.querySelector('.detail').textContent=row.note||row.variant;v.onloadedmetadata=()=>seek(0)}else{p.textContent=(row?.status==='not_planned'?'未安排 · ':'待完成 · ')+(row?.reason||'尚无媒体');s.querySelector('.detail').textContent='尚未提供可核验的视频';}});seek(0);}
async function play(){pause();if(!activeRows.every(x=>x?.playable)){$('#notice').textContent='左右都完成后才能同步播放；可先选择同一已完成版本。';return}const t=Number($('#seek').value);seek(t);const token=syncToken;try{await Promise.all(videos.map(v=>v.play()));if(token!==syncToken){videos.forEach(v=>v.pause());return}playing=true;requestAnimationFrame(tick)}catch(e){pause();$('#notice').textContent='视频尚未就绪或无法播放，请稍后重试。'}}
function tick(){if(!playing)return;const t=videos[0].currentTime;if(Math.abs(videos[1].currentTime-t)>0.08)videos[1].currentTime=t;$('#seek').value=t;$('#time').textContent=t.toFixed(2)+'s';if(t>=9.95||videos.some(v=>v.ended)){pause();if($('#loop').checked){seek(0);play()}return}requestAnimationFrame(tick)}
$('#play').onclick=play;$('#pause').onclick=pause;$('#reset').onclick=()=>{pause();seek(0)};$('#seek').oninput=()=>{pause();seek(Number($('#seek').value))};$('#character').onchange=refresh;$('#framing').onchange=refresh;
sides.forEach((s,i)=>{s.querySelector('select').onchange=refresh;s.querySelector('.freeze').onclick=()=>{pause();const v=videos[i];if(v.readyState<2){$('#notice').textContent='请等待当前帧加载。';return}const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);try{const url=c.toDataURL('image/png');s.querySelector('.still').src=url;s.querySelector('.still').hidden=false;v.hidden=true;s.querySelector('.back').hidden=false;const a=s.querySelector('.download');a.href=url;a.download=`${activeRows[i].character_id}_${activeRows[i].framing}_${activeRows[i].variant}_${v.currentTime.toFixed(2)}s.png`;a.hidden=false}catch(e){$('#notice').textContent='浏览器限制了静帧保存，请通过本机审查服务打开页面。'}};s.querySelector('.back').onclick=()=>{s.querySelector('.still').hidden=true;s.querySelector('.back').hidden=true;s.querySelector('.download').hidden=true;videos[i].hidden=false};videos[i].onerror=()=>{$('#notice').textContent='媒体加载失败，请检查审查服务与文件。'}});
refresh();
</script></html>
