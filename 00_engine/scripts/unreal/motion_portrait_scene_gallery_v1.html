<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作、竖屏与场景试拍审查</title>
<style>
:root{color-scheme:dark;--bg:#10161d;--panel:#1a242e;--line:#354452;--text:#edf3f8;--muted:#a8bacb;--accent:#8bd4bc}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1500px;margin:auto;padding:24px 30px}header{padding-bottom:0}h1{font-size:28px;margin:0 0 6px}p{margin:6px 0 16px}.muted{color:var(--muted)}nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 6px}button,select{font:inherit;border:1px solid var(--line);background:#253340;color:var(--text);padding:9px 15px;border-radius:8px;cursor:pointer}button[aria-selected=true]{background:var(--accent);color:#102d25;border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.selectors{display:flex;gap:20px;flex-wrap:wrap}.selectors label{display:flex;gap:8px;align-items:center}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.players.single{grid-template-columns:1fr;max-width:1100px;margin:auto}.card{min-width:0;background:#070b10;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card h3{margin:12px 16px 4px;font-size:18px}.card p{margin:4px 16px 12px}.card video{display:block;width:100%;height:min(62vh,670px);object-fit:contain;background:#05070a}.meta{color:var(--muted);font-size:14px}.note{white-space:pre-line}.empty{padding:40px;text-align:center;color:var(--muted)}.badge{display:inline-block;color:var(--accent);border:1px solid #45685e;border-radius:20px;padding:2px 10px;font-size:13px}.error{color:#ffb9af}.timeline{width:min(580px,60vw)}textarea{width:100%;min-height:90px;background:#101820;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit}.review-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}small{color:var(--muted)}@media(max-width:850px){header,main{padding:18px}.players{grid-template-columns:1fr}.selectors{gap:10px}.review-grid{grid-template-columns:1fr}.card video{height:55vh}}
</style></head><body><header><h1>动作、竖屏与场景试拍</h1><p class="muted">先看动作是否值得保留，再看竖屏构图，最后检查新场景的表演位置。所有新结果等待你的判断。</p><nav aria-label="审查内容"><button data-tab="motions" aria-selected="true">1 · 动作审查</button><button data-tab="portrait" aria-selected="false">2 · 横屏 / 竖屏对照</button><button data-tab="scenes" aria-selected="false">3 · 场景点位</button></nav></header>
<main><section class="panel"><p id="instructions"></p><div class="selectors"><label id="sceneLabel">场景 <select id="scene"></select></label><label>动作 <select id="motion"></select></label><label id="cameraLabel">镜头 <select id="camera"></select></label></div><p id="details" class="note muted"></p><span class="badge" id="status"></span> <button id="ready">先看已完成样片</button><p id="progress" class="muted"></p></section>
<div class="toolbar"><button id="play">一起从头播放</button><button id="pause">暂停</button><button id="resume">继续</button><label><input id="loop" type="checkbox" checked> 循环播放</label><label>共同进度 <input id="seek" class="timeline" type="range" min="0" max="1000" value="0"></label><span id="time" class="muted">0.00 秒</span></div><section id="players" class="players"></section><p id="playError" class="error" role="status"></p>
<section class="panel"><p><strong>记录当前观察</strong> <small>备注只保存在本浏览器，导出后可以发回讨论；不会自动修改动作或接受结果。</small></p><div class="review-grid"><textarea id="notes" placeholder="例如：行走自然；舞蹈侧面竖屏手部偶尔出画；场景1环绕有树挡住人物……"></textarea><button id="export">导出全部备注</button></div></section><p class="muted" id="footer"></p></main>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id);let tab='motions',videos=[],noteKey='',seeking=false;
const storeKey='motion_portrait_scene_pilot_notes_v1';let notes={};try{notes=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
const labels={keep:'完整保留',retained:'完整保留',trim:'截取后保留',trimmed:'截取后保留',exclude:'本轮排除',excluded:'本轮排除',review:'待观察',pending:'待观察'};
const secText={motions:'逐个查看动作。完整保留或截取是本轮整理建议，还需要你决定是否自然、是否保留。除向前行走外，暂不强行统一为10秒。',portrait:'选择同一个动作和镜头，左右对照横屏与竖屏。这里每条仅取最多10秒用于比较构图，并不表示动作库已统一裁成10秒；完整选用时长请看“动作审查”。重点看人物大小、四肢活动余量，以及跟拍是否平稳。',scenes:'先看点位说明，再播放代表动作和镜头。重点检查人物活动空间、地面接触，以及相机环绕和推拉时是否被遮挡。'};
function seconds(value){return Number.isFinite(value)?Number(value.toFixed(2)).toString():'—'}function text(el,value){el.textContent=value??''}function options(el,rows,previous){el.replaceChildren();for(const row of rows){const o=document.createElement('option');o.value=row.id;o.textContent=row.label||row.id;el.append(o)}if(rows.some(r=>r.id===previous))el.value=previous}
function saveNote(){if(noteKey){notes[noteKey]=$('notes').value;try{localStorage.setItem(storeKey,JSON.stringify(notes))}catch{}}}
function clips(){return DATA.clips.filter(c=>c.section===tab&&(tab!=='scenes'||c.scene_id===$('scene').value)&&c.motion_id===$('motion').value)}
function refreshFilters(){const old=$('motion').value;const sectionClips=DATA.clips.filter(c=>c.section===tab&&(tab!=='scenes'||c.scene_id===$('scene').value));let candidates=DATA.motions;if(tab!=='motions'){const ids=new Set(sectionClips.map(c=>c.motion_id));candidates=candidates.filter(m=>ids.has(m.id))}candidates=candidates.map(m=>{const cs=sectionClips.filter(c=>c.motion_id===m.id);return {...m,label:m.label+' · '+cs.filter(c=>c.playable).length+'/'+cs.length+' 可看'}});const firstReady=sectionClips.find(c=>c.playable)?.motion_id;options($('motion'),candidates,sectionClips.some(c=>c.motion_id===old&&c.playable)?old:(firstReady||old));refreshCameras()}
function refreshCameras(){const cs=clips();const found=new Map(cs.map(c=>[c.camera_id,{id:c.camera_id,label:(c.camera_label||c.camera_id)+(cs.some(x=>x.camera_id===c.camera_id&&x.playable)?' · 可看':' · 生成中')}]));const old=$('camera').value;options($('camera'),[...found.values()],cs.some(c=>c.camera_id===old&&c.playable)?old:(cs.find(c=>c.playable)?.camera_id||old));render()}
function render(){saveNote();videos.forEach(v=>v.pause());videos=[];$('players').replaceChildren();text($('playError'),'');const motion=DATA.motions.find(m=>m.id===$('motion').value);const scene=DATA.scenes.find(s=>s.id===$('scene').value);let selected=clips().filter(c=>c.camera_id===$('camera').value);selected.sort((a,b)=>(a.orientation==='landscape'?-1:1)-(b.orientation==='landscape'?-1:1));
let detail=[];if(motion){detail.push((labels[motion.decision]||motion.decision||'待观察')+' · '+(motion.reason||''));if(motion.source_window_seconds)detail.push(`动作选用窗口：原片 ${seconds(motion.source_window_seconds[0])}–${seconds(motion.source_window_seconds[1])} 秒 → 完整播放 ${seconds(motion.output_duration_seconds)} 秒`);if(tab==='portrait')detail.push('本区只比较构图：当前样片时长见下方视频，不改变完整动作选用时长。');if(motion.variant||motion.sex)detail.push('代表角色：'+(motion.variant||motion.sex))}if(tab==='scenes'&&scene){detail.push(scene.anchor_note||'');if(scene.limitations?.length)detail.push('需留意：'+scene.limitations.join('；'))}text($('details'),detail.filter(Boolean).join('\n'));text($('status'),tab==='scenes'&&scene?.review_status==='needs_rework'?'此场景候选有问题，正在更换':'人工审查待确认');$('players').className='players'+(selected.length<2?' single':'');
for(const clip of selected){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');text(h,(clip.orientation==='portrait'?'竖屏':'横屏')+' · '+(clip.camera_label||clip.camera_id));card.append(h);if(clip.playable){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.muted=true;v.loop=$('loop').checked;v.playsInline=true;v.src='../'+clip.video;if(clip.poster)v.poster='../'+clip.poster;v.setAttribute('aria-label',(motion?.label||clip.motion_id)+' '+h.textContent);v.addEventListener('error',()=>text($('playError'),'视频加载失败，请重新打开启动入口：'+clip.id));v.addEventListener('timeupdate',()=>{if(v===videos[0]&&!seeking){$('seek').value=v.duration?1000*v.currentTime/v.duration:0;text($('time'),v.currentTime.toFixed(2)+' 秒')}});card.append(v);videos.push(v)}else{const empty=document.createElement('div');empty.className='empty';text(empty,'尚未完成媒体验证，此片暂不可播放');card.append(empty)}const p=document.createElement('p');p.className='meta';text(p,`${clip.width||'—'} × ${clip.height||'—'} · ${seconds(clip.duration_seconds)} 秒`+(clip.note?' · '+clip.note:''));card.append(p);$('players').append(card)}
if(!selected.length){const p=document.createElement('p');p.className='empty';text(p,tab==='scenes'&&!DATA.scenes.length?'三个场景点位正在准备，完成真实试拍后会在这里开放。':motion?.decision==='exclude'||motion?.decision==='excluded'?'本轮已排除该动作，原因见上方。原始资产仍保留。':'这一项还没有可播放样片。');$('players').append(p)}for(const id of ['play','pause','resume','seek'])$(id).disabled=!videos.length;$('seek').value=0;text($('time'),'0.00 秒');noteKey=[tab,$('scene').value,$('motion').value,$('camera').value].join('/');$('notes').value=notes[noteKey]||'';text($('footer'),`当前可播放 ${DATA.playable_count} / ${DATA.clips.length} 段计划样片。原147条已接受横屏保持不变；本页全部是新试点结果。`)}
async function play(restart){text($('playError'),'');if(restart)videos.forEach(v=>v.currentTime=0);const results=await Promise.allSettled(videos.map(v=>v.play()));if(results.some(r=>r.status==='rejected'))text($('playError'),'部分视频未开始播放，可使用视频自带的播放按钮。')}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{saveNote();tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));$('sceneLabel').hidden=tab!=='scenes';text($('instructions'),secText[tab]);refreshFilters()});$('motion').onchange=refreshCameras;$('camera').onchange=render;$('scene').onchange=refreshFilters;$('play').onclick=()=>play(true);$('pause').onclick=()=>videos.forEach(v=>v.pause());$('resume').onclick=()=>play(false);$('loop').onchange=()=>videos.forEach(v=>v.loop=$('loop').checked);$('seek').oninput=()=>{seeking=true;const ratio=$('seek').value/1000;videos.forEach(v=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(v.duration-.001,ratio*v.duration)});seeking=false};$('notes').oninput=saveNote;$('export').onclick=()=>{saveNote();const blob=new Blob([JSON.stringify({schema:'pilot_human_notes_v1',exported_at:new Date().toISOString(),input_sha256:DATA.input_sha256,notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='动作竖屏场景审查备注.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};options($('scene'),DATA.scenes,'');$('sceneLabel').hidden=true;text($('instructions'),secText.motions);text($('progress'),`已完成媒体验证 ${DATA.playable_count} / ${DATA.clips.length} 段；${DATA.playable_count===DATA.clips.length?'全部样片已完成媒体验证，等待人工审查。':'其余样片生成中。'}场景点位：${DATA.scenes.length} / ${DATA.scene_pilot_target||3} 个已登记。`);$('ready').disabled=!DATA.playable_count;$('ready').onclick=()=>{const c=DATA.clips.find(x=>x.playable);if(!c)return;document.querySelector(`[data-tab="${c.section}"]`).click();if(c.scene_id){$('scene').value=c.scene_id;refreshFilters()}$('motion').value=c.motion_id;refreshCameras();$('camera').value=c.camera_id;render()};refreshFilters();
</script></body></html>
