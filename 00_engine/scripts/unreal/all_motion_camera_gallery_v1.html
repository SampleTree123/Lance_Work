<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部动作 · 当前标准镜头</title>
<style>
:root{color-scheme:dark;--bg:#111820;--panel:#1b2631;--line:#3a4b58;--fg:#edf3f7;--muted:#afbfcb;--accent:#93d8bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1500px;margin:auto;padding:24px 28px}header{padding-bottom:0}h1{font-size:29px;margin:0 0 6px}h2{font-size:20px;margin:0 0 12px}p{margin:5px 0 12px}.muted,small{color:var(--muted)}button,select,textarea,input{font:inherit}button,select,textarea{background:#253643;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 13px}button{cursor:pointer}button[aria-pressed=true]{background:var(--accent);color:#123327}button:disabled{opacity:.5;cursor:default}select{max-width:100%}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0}.cameras{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.cameras button{text-align:left;font-size:14px}.cameras small{display:block;font-size:12px}.players{display:grid;grid-template-columns:1fr;gap:16px}.card{min-width:0;background:#080c10;border:1px solid var(--line);border-radius:10px;overflow:hidden}.card h2,.card p{margin:10px 14px}.card video{display:block;width:100%;height:min(65vh,760px);object-fit:contain;background:#05070a}.empty{height:min(45vh,420px);display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}.warning{padding:10px 13px;margin:12px 14px;border:1px solid #b68853;border-radius:8px;background:#372b20;color:#ffe0b7}progress{width:min(700px,100%);height:11px;accent-color:var(--accent)}textarea{width:100%;min-height:80px;resize:vertical}.error{color:#ffb4ad}.params{display:flex;flex-wrap:wrap;gap:8px 20px}.params span{background:#243540;border-radius:7px;padding:6px 10px}.technical{overflow:auto;max-height:250px;font-size:12px}summary{cursor:pointer}a{color:var(--accent)}@media(max-width:1000px){.cameras{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){header,main{padding:16px}.cameras{grid-template-columns:repeat(2,1fr)}.card video{height:55vh}}
</style></head><body>
<header><h1>全部动作 · 当前标准镜头</h1><p class="muted">当前横竖屏参数已获用户接受，20 个非面部镜头暂定保留为现行标准。竖屏沿用本页已接受的实际距离。</p></header>
<main><section class="panel"><h2>当前标准 · 1200 条</h2><p>30 个动作 × 20 个镜头 × 横竖屏，面部近景已排除。</p><progress id="overall" max="1200" value="0"></progress><p id="progress" class="muted" role="status"></p>
<div class="toolbar"><label>动作 <select id="motion"></select></label><button id="prevMotion">上一个动作</button><button id="nextMotion">下一个动作</button><strong>画幅</strong><button id="landscape" aria-pressed="false">横屏</button><button id="portrait" aria-pressed="true">竖屏</button><button id="refresh">刷新完成进度</button></div><p id="motionProgress" class="muted"></p><div id="cameras" class="cameras"></div></section>
<section class="panel"><h2 id="cameraTitle"></h2><div id="params" class="params"></div><p class="muted">柔和跟随人物前后、左右和上下移动；不追着人物转身。允许肢体局部出画，可播放查看。</p><details><summary>查看参数与跟随记录</summary><pre id="technical" class="technical"></pre></details></section>
<div class="toolbar"><button id="play">从头播放</button><button id="pause">暂停</button><button id="resume">继续</button><label><input id="loop" type="checkbox" checked> 循环播放</label><label>进度 <input id="seek" type="range" min="0" max="1000" value="0"></label><span id="time" class="muted">0.00 秒</span></div><div id="players" class="players"></div><p id="playError" class="error" role="status"></p>
<section class="panel" style="margin-top:18px"><strong>当前动作、镜头和画幅备注</strong><p class="muted">只保存在本浏览器。导出后可发回讨论，备注不会自动变成验收结论。</p><textarea id="notes" placeholder="例如：竖屏距离合适；弯腰时需要重点检查……"></textarea><div class="toolbar"><button id="export">导出全部备注</button></div></section>
<p class="muted">用户已接受当前镜头效果，包括少数竖屏动作的较大局部出画；代表抽样备注保留供查阅。</p><p id="footer" class="muted"></p></main><script>
let DATA=__DATA__;
const $=id=>document.getElementById(id),storeKey='all_motion_camera_portrait115_notes_20261014_v1';
let motion=DATA.motions.find(m=>m.id==='MOTION_CAND_030')?.id||DATA.motions[0]?.id,camera='front_full',orientation='portrait',videos=[],notes={},noteKey='';try{notes=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
const element=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e},num=n=>typeof n==='number'?Number(n.toFixed(2)):n;
function selected(){return DATA.clips.find(c=>c.motion_id===motion&&c.camera_id===camera&&c.orientation===orientation)}
function save(){if(noteKey){notes[noteKey]=$('notes').value;try{localStorage.setItem(storeKey,JSON.stringify(notes))}catch{}}}
function diagnostics(r){const found=[];function walk(v){if(!v||typeof v!=='object')return;if(Number(v.outside_frame_count)>0)found.push(v);Object.values(v).forEach(x=>{if(x&&typeof x==='object')walk(x)})}walk(r?.framing_diagnostics);return found}
function drawMotions(){const s=$('motion');s.replaceChildren();for(const m of DATA.motions){const rows=DATA.clips.filter(c=>c.motion_id===m.id),option=element('option',`${m.label} · ${rows.filter(c=>c.playable).length}/${rows.length}`);option.value=m.id;s.append(option)}s.value=motion}
function drawCameras(){const root=$('cameras');root.replaceChildren();for(const c of DATA.cameras){const rows=DATA.clips.filter(x=>x.camera_id===c.id&&x.motion_id===motion),risk=rows.some(x=>diagnostics(x).length),b=element('button',c.label);b.setAttribute('aria-pressed',String(c.id===camera));b.append(element('small',`横屏 ${rows.find(x=>x.orientation==='landscape')?.playable?'已完成':'等待'} · 竖屏 ${rows.find(x=>x.orientation==='portrait')?.playable?'已完成':'等待'}${risk?' · 局部出画':''}`));b.onclick=()=>{save();camera=c.id;draw()};root.append(b)}}
function paramText(p){const out=[];if(typeof p.horizontal_fov_degrees==='number')out.push('水平视角 '+num(p.horizontal_fov_degrees)+'°');for(const [k,label] of [['azimuth','方位角'],['elevation','俯仰角'],['orbit','环绕幅度']])if(typeof p.preset?.[k]==='number')out.push(label+' '+num(p.preset[k])+'°');for(const [kind,ref] of Object.entries(p.references||{})){const label=kind==='full'?'全身':kind==='upper'?'上半身':kind;if(typeof ref.distance_cm==='number')out.push(label+'距离 '+num(ref.distance_cm/100)+' 米');if(typeof ref.initial_target_height_cm==='number')out.push(label+'取景高度 '+num(ref.initial_target_height_cm)+' cm')}return out}
function card(title,row,prefix){const c=element('article',undefined,'card');c.append(element('h2',title));c.append(element('p',row?.playable?`当前标准 · ${num(row.duration_seconds)} 秒 · ${DATA.human_acceptance==='accepted'?'用户已接受':'待用户检查'}`:'等待渲染与媒体核验','muted'));if(row?.playable){const v=element('video');v.controls=true;v.muted=true;v.playsInline=true;v.preload='metadata';v.loop=$('loop').checked;v.src=prefix+row.video.split('/').map(encodeURIComponent).join('/');if(row.poster)v.poster=prefix+row.poster.split('/').map(encodeURIComponent).join('/');v.onerror=()=>{$('playError').textContent='视频暂时无法读取，请刷新完成进度后重试。'};v.ontimeupdate=()=>{if(v===videos[0]){$('time').textContent=v.currentTime.toFixed(2)+' 秒';$('seek').value=v.duration?Math.round(v.currentTime/v.duration*1000):0}};videos.push(v);c.append(v)}else c.append(element('div','本条尚未完成。核验通过后会出现在这里。','empty'));const ds=diagnostics(row);if(ds.length){const warning=element('div',undefined,'warning');warning.append(element('strong','已记录的局部出画'));warning.append(element('p',`范围检查记录最多 ${Math.max(...ds.map(d=>d.outside_frame_count))} 个时刻有部位超出画面，可播放查看。`));c.append(warning)}if(row?.camera_id?.startsWith('dolly_')&&row.duration_seconds<7)c.append(element('p','动作短于推拉设计时间，镜头可能未走完。','muted'));if(DATA.geometry_risks_require_review.some(x=>x.shot_id===row?.id))c.append(element('div','该推拉镜头的范围计算有一处保留记录：起始上半身阶段，全身代理范围曾进入镜头后侧；实际使用的上半身及结束全身范围仍在前侧。请播放确认画面，不据此判为穿模。','warning'));if(row?.review_notes){const n=row.review_notes,box=element('div',undefined,n.has_local_crop_observation?'warning':'muted');if(!n.has_local_crop_observation){box.style.margin='12px 14px'}box.append(element('strong','代表样片观察 · 当前标准已接受'));box.append(element('p',n.message_zh));box.append(element('small',n.scope));c.append(box)}return c}
function draw(){videos.forEach(v=>v.pause());videos=[];$('players').replaceChildren();$('playError').textContent='';$('time').textContent='0.00 秒';$('seek').value=0;const r=selected(),label=DATA.motions.find(m=>m.id===motion)?.label||motion;$('cameraTitle').textContent=label+' · '+(DATA.cameras.find(c=>c.id===camera)?.label||camera)+' · '+(orientation==='landscape'?'横屏':'竖屏');const p=r?.common_preset_parameters||{};$('params').replaceChildren();for(const text of paramText(p))$('params').append(element('span',text));$('technical').textContent=JSON.stringify({共用参数:p,跟随记录:r?.tracking_policy},null,2);$('players').append(card(label+' · 当前标准',r,'../'));const count=DATA.clips.filter(c=>c.playable).length;$('overall').value=count;$('progress').textContent=`本轮媒体核验完成 ${count}/${DATA.clips.length} · 横屏 ${DATA.clips.filter(c=>c.orientation==='landscape'&&c.playable).length}/600 · 竖屏 ${DATA.clips.filter(c=>c.orientation==='portrait'&&c.playable).length}/600 · 用户已接受`;$('motionProgress').textContent=`当前动作：${DATA.clips.filter(c=>c.motion_id===motion&&c.playable).length}/40 完成`;$('footer').textContent='最近发布：'+DATA.updated_at;for(const o of ['landscape','portrait'])$(o).setAttribute('aria-pressed',String(o===orientation));for(const id of ['play','pause','resume'])$(id).disabled=!videos.length;noteKey=[motion,camera,orientation].join('_');$('notes').value=notes[noteKey]||'';drawMotions();drawCameras()}
async function play(reset){$('playError').textContent='';for(const v of videos)if(reset)v.currentTime=0;const result=await Promise.allSettled(videos.map(v=>v.play()));if(result.some(r=>r.status==='rejected'))$('playError').textContent='浏览器尚未允许播放，请点击视频自身的播放按钮。'}
$('motion').onchange=()=>{save();motion=$('motion').value;draw()};for(const [id,delta] of [['prevMotion',-1],['nextMotion',1]])$(id).onclick=()=>{save();const i=DATA.motions.findIndex(m=>m.id===motion);motion=DATA.motions[(i+delta+DATA.motions.length)%DATA.motions.length].id;draw()};for(const o of ['landscape','portrait'])$(o).onclick=()=>{save();orientation=o;draw()};$('play').onclick=()=>play(true);$('resume').onclick=()=>play(false);$('pause').onclick=()=>videos.forEach(v=>v.pause());$('loop').onchange=()=>videos.forEach(v=>v.loop=$('loop').checked);$('seek').oninput=()=>videos.forEach(v=>{if(Number.isFinite(v.duration))v.currentTime=v.duration*Number($('seek').value)/1000});$('notes').oninput=save;
$('export').onclick=()=>{save();const a=element('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'all_motion_camera_review_notes_v1',human_acceptance:'not_inferred',exported_at:new Date().toISOString(),notes},null,2)],{type:'application/json'}));a.download='全部动作镜头审查备注.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function refresh(){try{const response=await fetch('../review_delivery_manifest_v1.json?time='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const d=await response.json();if(d.trial_schema!=='camera_all_motions_portrait115_review_v1'||d.clips.length!==1200)throw Error();if(JSON.stringify(d)!==JSON.stringify(DATA)){save();DATA=d;draw()}}catch{$('playError').textContent='暂时无法刷新，现有样片仍可检查。'}}$('refresh').onclick=refresh;setInterval(refresh,30000);window.addEventListener('beforeunload',save);draw();
</script></body></html>
