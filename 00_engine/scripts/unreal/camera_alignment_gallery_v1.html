<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相机统一校对 · 动作与场景</title>
<style>
:root{color-scheme:dark;--bg:#111820;--panel:#1b2631;--line:#384957;--fg:#edf3f7;--muted:#afbfcb;--accent:#93d8bf}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1600px;margin:auto;padding:24px 30px}header{padding-bottom:0}h1{font-size:29px;margin:0 0 6px}h2{font-size:20px;margin:0 0 12px}p{margin:5px 0 13px}.muted,small{color:var(--muted)}nav,.toolbar,.selectors{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}button,select,input[type=search]{font:inherit;background:#253643;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 13px}button{cursor:pointer}button[aria-selected=true]{background:var(--accent);color:#123327}button:disabled{opacity:.4;cursor:default}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.selectors label{display:flex;gap:8px;align-items:center}.players{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{min-width:0;background:#080c10;border:1px solid var(--line);border-radius:10px;overflow:hidden}.card h3,.card p{margin:10px 16px}.card video{display:block;width:100%;height:min(62vh,660px);object-fit:contain;background:#05070a}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.badge{display:inline-block;background:#304c42;color:#b8f1d9;border-radius:20px;font-size:13px;padding:2px 10px}.exception{color:#ffd79b}.visualWarning{margin:10px 14px;padding:12px;border:1px solid #bb8153;border-radius:8px;background:#3b2b24;color:#ffe0b7}.visualWarning.priority{border-color:#e49a7c;background:#462a26;color:#ffd4c5}.visualWarning p{margin:4px 0 8px}.visualWarning button{font-size:13px;padding:4px 9px;margin:3px 5px 3px 0}.visualSummary{border-left:4px solid #e49a7c;padding:10px 14px;background:#382820;margin:12px 0}.matrix button.risk{border-color:#e49a7c;color:#ffd4c5}.note{white-space:pre-line}.error{color:#ffb4ad}.timeline{width:min(440px,45vw)}textarea{width:100%;min-height:90px;padding:12px;color:var(--fg);background:#111b24;border:1px solid var(--line);border-radius:8px;font:inherit}.scroll{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:10px;vertical-align:top}thead th{position:sticky;top:0;background:#24333f}td:first-child,th:first-child{min-width:165px}.matrix td,.matrix th{white-space:nowrap}.matrix button{font-size:12px;padding:4px 7px;min-width:65px}.matrix button.complete{border-color:#73b29a;color:#b8f1d9}.matrix button.partial{border-color:#b39968;color:#ffe3aa}summary{cursor:pointer;font-weight:600;padding:4px 0 12px}.scenePath{font-size:12px;overflow-wrap:anywhere;max-width:380px}progress{width:min(550px,100%);height:10px;accent-color:var(--accent)}@media(max-width:900px){header,main{padding:16px}.players{grid-template-columns:1fr}.selectors label{width:100%}select{max-width:85%}.card video{height:55vh}}
</style></head><body>
<header><h1>相机统一校对</h1><p class="muted">检查同类镜头的人物大小是否协调，再看旧动作能否换到另一性别。新场景仅检查导入，不包含新点位试拍。</p><nav aria-label="审查内容"><button data-tab="cameras" aria-selected="true">1 · 相机构图</button><button data-tab="cross_sex" aria-selected="false">2 · 旧动作跨性别</button><button data-tab="scenes" aria-selected="false">3 · 场景导入清单</button></nav></header>
<main><section class="panel"><p id="instructions"></p><p id="policy" class="muted note"></p><progress id="overall" max="1" value="0"></progress><p id="progress" class="muted"></p><div id="visualSummary" class="visualSummary" hidden><strong>视频编码完好，不等于构图已经通过。</strong><p id="visualSummaryText"></p><button id="priorityRisk">优先查看主体离框样片</button></div><div id="motionControls"><div class="selectors"><label>动作 <select id="motion"></select></label><label id="cameraLabel">镜头 <select id="camera"></select></label><label id="orientationLabel">画幅 <select id="orientation"><option value="both">横屏与竖屏对照</option><option value="landscape">只看横屏</option><option value="portrait">只看竖屏</option></select></label><label id="exceptionLabel"><input type="checkbox" id="exceptions"> 只看距离调整例外</label><label id="riskLabel"><input type="checkbox" id="risksOnly"> 只看视觉待审提醒</label></div><div class="toolbar"><button id="previous">上一个动作</button><button id="next">下一个动作</button><button id="ready">跳到已完成样片</button><button id="refresh">刷新进度</button></div><p id="details" class="muted note"></p></div></section>
<section id="videoSection"><div class="toolbar"><button id="play">一起从头播放</button><button id="pause">暂停</button><button id="resume">继续</button><label><input id="loop" type="checkbox" checked> 循环播放</label><label>进度 <input id="seek" class="timeline" type="range" min="0" max="1000" value="0"></label><span id="time" class="muted">0.00 秒</span></div><div id="players" class="players"></div><p id="playError" class="error" role="status"></p><section class="panel"><p><strong>当前组合备注</strong> <small>仅保存在本浏览器；导出后可以发回讨论，不自动判定通过。</small></p><textarea id="notes" placeholder="例如：舞蹈竖屏人物略小；弯腰时头部接近边缘；男角色播放原女性动作自然……"></textarea><div class="toolbar"><button id="export">导出全部备注</button></div></section><details id="coverage" class="panel"><summary>查看全部动作 × 镜头进度（点击格子直接查看）</summary><p class="muted">每格依次显示横屏 / 竖屏是否可看。★ 表示距离调整例外；⚠ 表示已发现视觉问题待审。可看只表示视频可播放，不代表构图通过。</p><div id="matrix" class="scroll"></div></details></section>
<section id="sceneSection" class="panel" hidden><h2>下载场景的导入结果</h2><p class="muted">“文件已复制”不等于 UE 已验证。“已存在”表示避免重复导入；仍以逐项说明为准。本轮没有选择角色表演位置。</p><label>查找场景 <input type="search" id="sceneSearch" placeholder="输入场景名称"></label><div class="scroll"><table><thead><tr><th>场景</th><th>状态</th><th>工程位置与地图</th><th>说明</th></tr></thead><tbody id="sceneRows"></tbody></table></div></section><p id="footer" class="muted"></p></main>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id),sexLabel={male:'男性',female:'女性'},storeKey='camera_alignment_notes_20261012_v1';
let tab='cameras',videos=[],noteKey='',notes={};try{notes=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
const instructions={cameras:'选择动作和镜头，左右对比横屏与竖屏。重点看人物大小、四肢活动余量和跟拍稳定性。多数动作保持相近尺度；大幅度动作如需例外，会明确说明。',cross_sex:'左边为原性别，右边为另一性别。检查动作姿态、手脚、身体比例和衣服跟随是否自然。这里保留原动作时长，不强行拉长到10秒。',scenes:'逐项查看场景是否已进入工程、UE加载检查是否完成。失败或尚未完成的内容会保留原因，方便你检查。'};
function text(el,v){el.textContent=v??''}function sec(v){return Number.isFinite(v)?Number(v.toFixed(2)):'—'}
function options(el,rows,old){el.replaceChildren();for(const row of rows){const o=document.createElement('option');o.value=row.id;text(o,row.label||row.id);el.append(o)}if(rows.some(r=>r.id===old))el.value=old}
function saveNote(){if(!noteKey)return;notes[noteKey]=$('notes').value;try{localStorage.setItem(storeKey,JSON.stringify(notes))}catch{}}
function sectionClips(){return DATA.clips.filter(c=>c.section===tab&&(tab!=='cameras'||!$('exceptions').checked||c.scale_exception)&&(!$('risksOnly').checked||c.visual_risk))}
function refreshMotions(){saveNote();const cs=sectionClips(),ids=new Set(cs.map(c=>c.motion_id));options($('motion'),DATA.motions.filter(m=>ids.has(m.id)).map(m=>{const rows=cs.filter(c=>c.motion_id===m.id);return {...m,label:m.label+' · '+rows.filter(c=>c.playable).length+'/'+rows.length+' 可看'}}),$('motion').value);refreshCameras()}
function refreshCameras(){saveNote();const cs=sectionClips().filter(c=>c.motion_id===$('motion').value),ids=new Set(cs.map(c=>c.camera_id));options($('camera'),DATA.cameras.filter(c=>ids.has(c.id)),$('camera').value||DATA.default_camera_id);render()}
function selectedClips(){let cs=sectionClips().filter(c=>c.motion_id===$('motion').value&&c.camera_id===$('camera').value);if(tab==='cameras'){if($('orientation').value!=='both')cs=cs.filter(c=>c.orientation===$('orientation').value);return cs.sort((a,b)=>(a.orientation==='landscape'?0:1)-(b.orientation==='landscape'?0:1))}const crossed=cs[0];if(!crossed)return [];let original=DATA.clips.find(c=>c.id===crossed.reference_clip_id);if(!original)original=DATA.clips.find(c=>c.section==='cameras'&&c.motion_id===crossed.motion_id&&c.camera_id===crossed.camera_id&&c.orientation==='landscape'&&c.sex!==crossed.sex);if(!original?.playable){const prior=(DATA.original_sex_references||[]).find(c=>c.motion_id===crossed.motion_id&&c.sex!==crossed.sex&&c.playable);if(prior)original=prior}return [original,crossed].filter(Boolean)}
function render(){saveNote();for(const v of videos)v.pause();videos=[];$('players').replaceChildren();text($('playError'),'');const motion=DATA.motions.find(m=>m.id===$('motion').value),cs=selectedClips();let details=[];if(motion?.source_window_seconds)details.push(`选用原片 ${sec(motion.source_window_seconds[0])}–${sec(motion.source_window_seconds[1])} 秒；完整动作 ${sec(motion.output_duration_seconds)} 秒。`);if(tab==='cross_sex')details.push('左右使用同一动作窗口和速度，按秒对齐；本轮原性别镜头未完成时，先用此前已审样片。构图可能不同，仅比较姿态兼容，不比较人物大小。');if(motion?.note)details.push(motion.note);text($('details'),details.join('\n'));
for(const clip of cs){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');const cam=DATA.cameras.find(c=>c.id===clip.camera_id)?.label||clip.camera_id;text(h,tab==='cross_sex'?(clip.section==='cross_sex'?'另一性别 · ':clip.not_current_render?'原性别（此前已审参考）· ':'原性别（本轮）· ')+sexLabel[clip.sex]:(clip.orientation==='portrait'?'竖屏':'横屏')+' · '+cam);card.append(h);if(clip.playable){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.muted=true;v.loop=$('loop').checked;v.playsInline=true;v.src='../'+clip.video;if(clip.poster)v.poster='../'+clip.poster;v.setAttribute('aria-label',(motion?.label||clip.motion_id)+' '+h.textContent);v.addEventListener('error',()=>text($('playError'),'视频加载失败：'+clip.id+'。请通过启动入口重新打开。'));v.addEventListener('timeupdate',()=>{if(v===videos[0]){const d=commonDuration();$('seek').value=d?1000*v.currentTime/d:0;text($('time'),v.currentTime.toFixed(2)+' 秒')}});card.append(v);videos.push(v)}else{const p=document.createElement('div');p.className='empty';text(p,clip.verification_status==='failed'?'本项未通过检查，暂不可播放':'待生成或待媒体验证，暂不可播放');card.append(p)}const meta=document.createElement('p');meta.className='muted';text(meta,`${clip.width||'—'} × ${clip.height||'—'} · ${sec(clip.duration_seconds)} 秒 · ${sexLabel[clip.sex]}`);card.append(meta);addVisualWarning(clip,card);if(clip.scale_exception){const p=document.createElement('p');p.className='exception';text(p,'★ 构图例外：'+clip.scale_exception_reason);card.append(p)}if(clip.note){const p=document.createElement('p');p.className='note';text(p,clip.note);card.append(p)}$('players').append(card)}
if(!cs.length){const p=document.createElement('p');p.className='empty';text(p,($('exceptions').checked||$('risksOnly').checked)?'当前没有符合筛选条件的构图例外。':'当前组合尚未登记。');$('players').append(p)}for(const id of ['play','pause','resume','seek'])$(id).disabled=!videos.length;$('seek').value=0;text($('time'),'0.00 秒');noteKey=[tab,$('motion').value,$('camera').value,$('orientation').value].join('/');$('notes').value=notes[noteKey]||'';$('previous').disabled=$('motion').selectedIndex<=0;$('next').disabled=$('motion').selectedIndex<0||$('motion').selectedIndex>=$('motion').options.length-1}
function addVisualWarning(clip,card){const risk=clip.visual_risk;if(!risk)return;const box=document.createElement('div');box.className='visualWarning'+(risk.level==='priority_review'?' priority':'');const title=document.createElement('strong');text(title,'视觉待审 · '+risk.title);box.append(title);for(const msg of [risk.message_zh,risk.confirmed_full_resolution_absent_face_samples?.note_zh,risk.duration_note_zh]){if(!msg)continue;const p=document.createElement('p');text(p,msg);box.append(p)}const v=card.querySelector('video');for(const t of risk.attention_seconds||[]){const b=document.createElement('button');text(b,sec(t)+' 秒');b.disabled=!v;b.onclick=()=>{v.pause();v.currentTime=Math.min(t,Number.isFinite(v.duration)?Math.max(0,v.duration-.001):t)};box.append(b)}card.insertBefore(box,card.children[1]||null)}
function jumpToRisk(){const candidates=DATA.clips.filter(c=>c.visual_risk&&c.playable);candidates.sort((a,b)=>(b.visual_risk.confirmed_full_resolution_absent_face_samples?.count||0)-(a.visual_risk.confirmed_full_resolution_absent_face_samples?.count||0));const c=candidates[0];if(!c)return;switchTab(c.section);$('exceptions').checked=false;$('risksOnly').checked=false;refreshMotions();$('motion').value=c.motion_id;refreshCameras();$('camera').value=c.camera_id;$('orientation').value='both';render();$('players').scrollIntoView({behavior:'smooth'})}
function commonDuration(){return Math.max(0,...videos.map(v=>Number.isFinite(v.duration)?v.duration:0))}
async function play(restart){text($('playError'),'');if(restart)videos.forEach(v=>v.currentTime=0);const results=await Promise.allSettled(videos.map(v=>v.play()));if(results.some(r=>r.status==='rejected'))text($('playError'),'部分视频未开始播放，可使用视频自带播放按钮。')}
function matrix(){const table=document.createElement('table');table.className='matrix';const head=document.createElement('thead'),tr=document.createElement('tr');for(const label of ['动作',...DATA.cameras.map(c=>c.label)]){const th=document.createElement('th');text(th,label);tr.append(th)}head.append(tr);table.append(head);const body=document.createElement('tbody');for(const motion of DATA.motions){const tr=document.createElement('tr'),name=document.createElement('td');text(name,motion.label);tr.append(name);for(const cam of DATA.cameras){const td=document.createElement('td'),cs=DATA.clips.filter(c=>c.section==='cameras'&&c.motion_id===motion.id&&c.camera_id===cam.id),button=document.createElement('button');const ready=cs.filter(c=>c.playable).length;button.className=cs.some(c=>c.visual_risk)?'risk':ready===2?'complete':ready?'partial':'';text(button,['landscape','portrait'].map(o=>cs.some(c=>c.orientation===o&&c.playable)?'可看':'待生成').join(' / ')+(cs.some(c=>c.scale_exception)?' ★':'')+(cs.some(c=>c.visual_risk)?' ⚠':''));button.disabled=!cs.length;button.onclick=()=>{switchTab('cameras');$('exceptions').checked=false;$('risksOnly').checked=false;refreshMotions();$('motion').value=motion.id;refreshCameras();$('camera').value=cam.id;render();$('motionControls').scrollIntoView({behavior:'smooth'})};td.append(button);tr.append(td)}body.append(tr)}table.append(body);$('matrix').replaceChildren(table)}
const sceneLabels={imported_verified:'UE 加载检查通过',copied_pending_ue:'文件已复制，待 UE 检查',already_present:'已存在，避免重复',failed:'导入或检查失败',incomplete:'下载未完成',pending:'待处理'};
function sceneRows(){
 const query=$('sceneSearch').value.trim().toLowerCase();$('sceneRows').replaceChildren();
 for(const scene of DATA.scenes.filter(s=>(s.label+' '+s.id).toLowerCase().includes(query))){
  const row=document.createElement('tr'),needsReview=scene.needs_review===true;
  const roots=scene.content_roots?.length?scene.content_roots:(scene.content_root?[scene.content_root]:[]);
  const label=needsReview&&scene.status==='imported_verified'?'已加载 · 有资源待检查':sceneLabels[scene.status];
  for(const [value,cls] of [[scene.label||scene.id,''],[label,needsReview?'exception':scene.status==='failed'?'error':''],[(roots.length?roots.join('\n'):'—')+(scene.maps?.length?'\n地图：\n'+scene.maps.join('\n'):''),'scenePath note']]){const td=document.createElement('td');td.className=cls;text(td,value);if(needsReview&&value===label)td.style.fontWeight='700';row.append(td)}
  const info=document.createElement('td');info.className='note';const reason=document.createElement('p');text(reason,scene.reason||'—');info.append(reason);
  const hard=scene.remaining_hard_dependency_candidates||[],soft=scene.remaining_soft_dependency_candidates||[];
  if(hard.length||soft.length){const details=document.createElement('details'),summary=document.createElement('summary');text(summary,`展开资源检查提示（需复查 ${hard.length} 项 / 历史软引用 ${soft.length} 项）`);details.append(summary);for(const [title,paths] of [['硬依赖缺失候选：需要复查，不能视为完整可用',hard],['历史软引用候选：不单独据此判定核心场景失败',soft]]){if(!paths.length)continue;const p=document.createElement('p');text(p,title);details.append(p);const list=document.createElement('div');list.className='scenePath note';text(list,paths.join('\n'));details.append(list)}info.append(details)}
  row.append(info);$('sceneRows').append(row)
 }
 if(!DATA.scenes.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;text(td,'场景盘点结果尚未登记。');tr.append(td);$('sceneRows').append(tr)}
}
function switchTab(value){saveNote();tab=value;if(tab!=='cameras')$('risksOnly').checked=false;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));const scenes=tab==='scenes';$('visualSummary').hidden=tab!=='cameras'||!DATA.visual_risk_count;$('policy').hidden=scenes;$('overall').hidden=scenes;$('progress').hidden=scenes;$('motionControls').hidden=scenes;$('videoSection').hidden=scenes;$('sceneSection').hidden=!scenes;$('coverage').hidden=tab!=='cameras';for(const id of ['cameraLabel','orientationLabel','exceptionLabel','riskLabel'])$(id).hidden=tab!=='cameras';text($('instructions'),instructions[tab]);videos.forEach(v=>v.pause());if(scenes)sceneRows();else refreshMotions()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('motion').onchange=refreshCameras;$('camera').onchange=render;$('orientation').onchange=render;$('exceptions').onchange=refreshMotions;$('risksOnly').onchange=refreshMotions;$('sceneSearch').oninput=sceneRows;$('play').onclick=()=>play(true);$('pause').onclick=()=>videos.forEach(v=>v.pause());$('resume').onclick=()=>play(false);$('loop').onchange=()=>videos.forEach(v=>v.loop=$('loop').checked);$('seek').oninput=()=>{const t=$('seek').value/1000*commonDuration();videos.forEach(v=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(Math.max(0,v.duration-.001),t)})};$('notes').oninput=saveNote;$('refresh').onclick=()=>{saveNote();location.reload()};for(const [id,step] of [['previous',-1],['next',1]])$(id).onclick=()=>{saveNote();$('motion').selectedIndex+=step;refreshCameras()};$('ready').onclick=()=>{const clip=sectionClips().find(c=>c.playable);if(!clip)return;$('motion').value=clip.motion_id;refreshCameras();$('camera').value=clip.camera_id;render()};$('export').onclick=()=>{saveNote();const blob=new Blob([JSON.stringify({schema:'camera_alignment_human_notes_v1',exported_at:new Date().toISOString(),input_sha256:DATA.input_sha256,notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='相机与跨性别动作审查备注.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
text($('policy'),DATA.camera_policy||'同类镜头保持相近人物大小，大幅度动作保留明确的取景例外。');$('overall').max=Math.max(1,DATA.clips.length);$('overall').value=DATA.playable_count;text($('progress'),`已完成媒体验证 ${DATA.playable_count} / ${DATA.clips.length} 条。${DATA.playable_count===DATA.clips.length?'所有计划样片已可播放，等待人工审查。':'待生成格子会保留，刷新可查看最新进度。'}`);text($('footer'),(DATA.summary_notes||[]).join('；')+` 本页结果等待你的审查。更新：${DATA.updated_at||'见当前生成批次'}。旧审查结果保持不变。`);const majorRisk=DATA.clips.filter(c=>c.visual_risk).sort((a,b)=>(b.visual_risk.confirmed_full_resolution_absent_face_samples?.count||0)-(a.visual_risk.confirmed_full_resolution_absent_face_samples?.count||0))[0];$('visualSummary').hidden=!DATA.visual_risk_count;text($('visualSummaryText'),`已有 ${DATA.visual_risk_count||0} 条样片发现需要人工检查的构图问题，其中 ${DATA.priority_visual_risk_count||0} 条优先查看。`+(majorRisk?'重点：'+(DATA.motions.find(m=>m.id===majorRisk.motion_id)?.label||majorRisk.motion_id)+' · '+(DATA.cameras.find(c=>c.id===majorRisk.camera_id)?.label||majorRisk.camera_id)+'。'+majorRisk.visual_risk.message_zh:'')+' 仍保留供审查，不能视为构图通过；抽样结果不代表连续离框时长。');$('priorityRisk').onclick=jumpToRisk;$('priorityRisk').disabled=!DATA.clips.some(c=>c.visual_risk&&c.playable);matrix();switchTab('cameras');
</script></body></html>
