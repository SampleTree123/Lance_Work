<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="810" viewBox="0 0 1160 810" role="img" aria-label="第三轮编辑的序列、路由与块级注意力"><title>第三轮编辑的序列、路由与块级注意力</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#43556b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b43} .title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}.line{stroke:#43556b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f5f8fc"/><text x="30" y="42" class="title">第三轮：V0 → p1 → V1 → p2 → V2 → p3 → V3</text><text x="30" y="74" class="small">真实序列含角色和特殊 token；本图省略标记，只展示信息来源。GT 训练的目标是 V3。</text><rect x="30" y="110" width="170" height="105" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="46" y="140" class="label">user</text><text x="46" y="168" class="small">ViT(V0) + p1</text><text x="46" y="192" class="small">UND</text><rect x="215" y="110" width="170" height="105" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="231" y="140" class="label">assistant</text><text x="231" y="168" class="small">ViT(V1)</text><text x="231" y="192" class="small">UND</text><rect x="400" y="110" width="145" height="105" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="416" y="140" class="label">user</text><text x="416" y="168" class="small">p2</text><text x="416" y="192" class="small">UND</text><rect x="560" y="110" width="210" height="105" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="576" y="140" class="label">assistant</text><text x="576" y="168" class="small">ViT(V2) + VAE(V2)</text><text x="576" y="192" class="small">UND + GEN</text><rect x="785" y="110" width="145" height="105" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="801" y="140" class="label">user</text><text x="801" y="168" class="small">p3</text><text x="801" y="192" class="small">UND</text><rect x="945" y="110" width="185" height="105" rx="12" fill="#fff0d9" stroke="#9daec0"/><text x="961" y="140" class="label">assistant</text><text x="961" y="168" class="small">noisy VAE(V3)</text><text x="961" y="192" class="small">GEN + loss</text><text x="30" y="254" class="label">语义块级 attention：行是 Query，列是 Key</text><text x="238" y="300" class="small">文本/标记</text><text x="35" y="367" class="small">文本/标记</text><text x="398" y="300" class="small">历史 ViT</text><text x="35" y="437" class="small">历史 ViT</text><text x="558" y="300" class="small">最近源 VAE</text><text x="35" y="507" class="small">最近源 VAE</text><text x="718" y="300" class="small">目标 noisy VAE</text><text x="35" y="577" class="small">目标 noisy VAE</text><rect x="230" y="325" width="155" height="65" rx="5" fill="#c5e8da"/><text x="256" y="364" class="small">按序</text><rect x="390" y="325" width="155" height="65" rx="5" fill="#dce8f8"/><text x="416" y="364" class="small">只读此前</text><rect x="550" y="325" width="155" height="65" rx="5" fill="#dce8f8"/><text x="576" y="364" class="small">只读此前</text><rect x="710" y="325" width="155" height="65" rx="5" fill="#e6e9ee"/><text x="736" y="364" class="small">不可读</text><rect x="230" y="395" width="155" height="65" rx="5" fill="#dce8f8"/><text x="256" y="434" class="small">只读此前</text><rect x="390" y="395" width="155" height="65" rx="5" fill="#c5e8da"/><text x="416" y="434" class="small">块内双向</text><rect x="550" y="395" width="155" height="65" rx="5" fill="#dce8f8"/><text x="576" y="434" class="small">只读此前</text><rect x="710" y="395" width="155" height="65" rx="5" fill="#e6e9ee"/><text x="736" y="434" class="small">不可读</text><rect x="230" y="465" width="155" height="65" rx="5" fill="#dce8f8"/><text x="256" y="504" class="small">只读此前</text><rect x="390" y="465" width="155" height="65" rx="5" fill="#dce8f8"/><text x="416" y="504" class="small">只读此前</text><rect x="550" y="465" width="155" height="65" rx="5" fill="#c5e8da"/><text x="576" y="504" class="small">块内双向</text><rect x="710" y="465" width="155" height="65" rx="5" fill="#e6e9ee"/><text x="736" y="504" class="small">不可读</text><rect x="230" y="535" width="155" height="65" rx="5" fill="#dce8f8"/><text x="256" y="574" class="small">可读此前</text><rect x="390" y="535" width="155" height="65" rx="5" fill="#dce8f8"/><text x="416" y="574" class="small">可读此前</text><rect x="550" y="535" width="155" height="65" rx="5" fill="#dce8f8"/><text x="576" y="574" class="small">可读此前</text><rect x="710" y="535" width="155" height="65" rx="5" fill="#c5e8da"/><text x="736" y="574" class="small">块内双向</text><rect x="905" y="325" width="225" height="275" rx="12" fill="#eee7fa" stroke="#9daec0"/><text x="921" y="355" class="label">三条关键约束</text><text x="921" y="383" class="small">不同文档完全隔离</text><text x="921" y="407" class="small">视觉块内可双向</text><text x="921" y="431" class="small">条件不可读取目标</text><text x="921" y="455" class="small">目标可读取此前条件</text><text x="921" y="479" class="small"></text><text x="921" y="503" class="small">精确可见性由实际</text><text x="921" y="527" class="small">split 顺序和 mode 决定</text><rect x="30" y="640" width="1100" height="132" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="46" y="670" class="label">Packing 与 padding</text><text x="46" y="698" class="small">一个或多个真实文档顺序拼接 → 独立尾部 pad document → 补到128倍数，最多127 token</text><text x="46" y="722" class="small">sample_lens/split_lens 维持边界；即便补0个 token，也保留 pad sentinel。</text><text x="46" y="746" class="small">这是 attention 尾部补齐优化；没有裁剪真实视频 latent，也没有把 latent 变成对角矩阵。</text></svg>
