<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="825" viewBox="0 0 1160 825" role="img" aria-label="GT 前缀训练与整链 pred_x0 的梯度边界"><title>GT 前缀训练与整链 pred_x0 的梯度边界</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#43556b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b43} .title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}.line{stroke:#43556b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f5f8fc"/><text x="30" y="42" class="title">两种训练历史：监督始终来自当前轮 GT</text><text x="30" y="74" class="small">绿色=带梯度监督；蓝色=无梯度历史；橙色=更新。pred_x0 不是纯噪声30步推理的等价替代。</text><rect x="30" y="110" width="515" height="130" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="46" y="140" class="label">GT 前缀训练</text><text x="46" y="168" class="small">独立取 prefix R1 / R2 / R3 …</text><text x="46" y="192" class="small">所有历史取 GT，当前目标加噪</text><text x="46" y="216" class="small">每卡每微步一个 prefix；重复前缀可能重复编码</text><rect x="615" y="110" width="515" height="130" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="631" y="140" class="label">整链 pred_x0 v2</text><text x="631" y="168" class="small">同一 chain stream 按 R1 → R2 → R3 …</text><text x="631" y="192" class="small">上一轮预测视频成为下一轮历史</text><text x="631" y="216" class="small">不为每个 prefix 从头重新生成历史</text><path d="M287 240 V275" class="line"/><path d="M872 240 V275" class="line"/><rect x="30" y="275" width="515" height="110" rx="12" fill="#e1f4e8" stroke="#9daec0"/><text x="46" y="305" class="label">一次带梯度 forward → loss → backward</text><text x="46" y="333" class="small">目标 token MSE；历史本身不作为当前监督</text><text x="46" y="357" class="small">不同前缀可独立 shuffle</text><rect x="615" y="275" width="515" height="110" rx="12" fill="#e1f4e8" stroke="#9daec0"/><text x="631" y="305" class="label">每轮一次带梯度 forward → loss → backward</text><text x="631" y="333" class="small">当前目标仍取 GT；复用此 forward 的速度预测</text><text x="631" y="357" class="small">无需额外历史模型 forward</text><path d="M287 385 V570" class="line"/><path d="M872 385 V425" class="line"/><rect x="615" y="425" width="515" height="108" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="631" y="455" class="label">detach → pred_x0 → no_grad VAE decode</text><text x="631" y="483" class="small">pred_x0 = zt − t · v_pred</text><text x="631" y="507" class="small">clamp / 编码成下一轮条件；不跨轮反向传播</text><path d="M1130 479 H1146 V253 H872 V275" class="line"/><text x="646" y="559" class="small">最后一轮没有后继时无需解码；参数在窗口末尾更新。</text><rect x="30" y="570" width="515" height="123" rx="12" fill="#fff0d9" stroke="#9daec0"/><text x="46" y="600" class="label">8卡 × batch1 × 累计4 → AdamW 更新</text><text x="46" y="628" class="small">每个微步做全局 token 均值，再平均4次</text><text x="46" y="652" class="small">global32 个目标前缀</text><text x="46" y="676" class="small">不是每卡同时并行4个样本</text><rect x="615" y="580" width="515" height="113" rx="12" fill="#fff0d9" stroke="#9daec0"/><text x="631" y="610" class="label">整链 window 32目标曝光 → AdamW 更新</text><text x="631" y="638" class="small">先统计整个窗口的全局目标 token 数</text><text x="631" y="662" class="small">各 rank 轮数可不同；统一分母，不再除4</text><text x="30" y="741" class="label">对照边界</text><text x="30" y="775" class="small">整链版本改变了历史来源、采样组织和归约范围；R5×3保留，额外后轮权重未增加。</text></svg>
