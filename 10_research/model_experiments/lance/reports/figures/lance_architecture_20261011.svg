<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="890" viewBox="0 0 1160 890" role="img" aria-label="Lance 当前训练架构：冻结编码器与可训练双分支 LoRA"><title>Lance 当前训练架构：冻结编码器与可训练双分支 LoRA</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#43556b"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b43} .title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}.line{stroke:#43556b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f5f8fc"/><text x="30" y="42" class="title">Lance：从多轮视频条件到目标速度场</text><text x="30" y="72" class="small">2026-10-11 · 当前混合训练 · 蓝色=冻结特征/状态，绿色=含可训练 LoRA，橙色=监督</text><rect x="30" y="105" width="320" height="120" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="46" y="135" class="label">历史视频 V0 … V(r−1)</text><text x="46" y="163" class="small">全部历史 → 冻结 ViT → 语义 token</text><text x="46" y="187" class="small">最近源视频 → 冻结 VAE → 细节 latent</text><rect x="420" y="105" width="320" height="120" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="436" y="135" class="label">对话文本 p1 … pr</text><text x="436" y="163" class="small">Tokenizer + 冻结 token embedding</text><text x="436" y="187" class="small">角色 / 视频起止标记也占序列位置</text><rect x="810" y="105" width="320" height="120" rx="12" fill="#fff0d9" stroke="#9daec0"/><text x="826" y="135" class="label">当前 GT 目标 Vr</text><text x="826" y="163" class="small">冻结 VAE → z0；采样 ε、t</text><text x="826" y="187" class="small">zt = (1−t) z0 + t ε</text><path d="M190 225 V275" class="line"/><path d="M580 225 V275" class="line"/><path d="M970 225 V275" class="line"/><rect x="30" y="275" width="1100" height="102" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="46" y="305" class="label">一个 packed 多模态序列</text><text x="46" y="333" class="small">文本、全部历史 ViT、最近源 VAE、当前目标 noisy VAE；只有目标位置参与 MSE</text><text x="46" y="357" class="small">源/目标 latent 经 vae2llm + 时间/空间位置编码；文档边界、块 mask、多维 RoPE 保持一致</text><path d="M580 377 V423" class="line"/><rect x="30" y="423" width="1100" height="288" rx="16" fill="#fff" stroke="#728aa3"/><text x="50" y="454" class="label">36 × MoT Decoder Layer · hidden2048 · Q heads16 / KV heads2</text><rect x="55" y="477" width="370" height="96" rx="12" fill="#e1f4e8" stroke="#9daec0"/><text x="71" y="507" class="label">UND：文本 + ViT token</text><text x="71" y="535" class="small">独立 Norm / QKV / O / FFN</text><text x="71" y="559" class="small">252 个 Linear 注入 r64 LoRA</text><rect x="735" y="477" width="370" height="96" rx="12" fill="#e1f4e8" stroke="#9daec0"/><text x="751" y="507" class="label">GEN：源 + 目标 VAE token</text><text x="751" y="535" class="small">独立 Norm / QKV / O / FFN</text><text x="751" y="559" class="small">252 个层内 Linear 注入 r64 LoRA</text><rect x="444" y="480" width="272" height="88" rx="12" fill="#eee7fa" stroke="#9daec0"/><text x="460" y="510" class="label">共享 Attention 交互</text><text x="460" y="538" class="small">按 mask 读取允许的条件</text><text x="460" y="562" class="small">训练 FlexAttention</text><path d="M425 515 H444" class="line"/><path d="M735 535 H716" class="line"/><text x="55" y="611" class="small">参数路由由 token 类型决定；两侧通过 attention 交换信息，不是两套互不相通的网络。</text><text x="55" y="642" class="small">0–25 层启用梯度检查点，26–35 层保留普通激活；冻结 base，但保留穿过 base 的激活梯度。</text><text x="55" y="673" class="small">另有 4 个生成 I/O Linear 的 LoRA：vae2llm / llm2vae / time MLP 两层。</text><path d="M580 711 V752" class="line"/><rect x="30" y="752" width="510" height="100" rx="12" fill="#fff0d9" stroke="#9daec0"/><text x="46" y="782" class="label">训练：只取目标位置 → llm2vae → v_pred</text><text x="46" y="810" class="small">与 ε−z0 做 MSE → 归约 → backward</text><text x="46" y="834" class="small">只更新 LoRA；GT 当前目标不作为干净条件</text><rect x="620" y="752" width="510" height="100" rx="12" fill="#e2edf9" stroke="#9daec0"/><text x="636" y="782" class="label">推理：从目标噪声开始迭代求解</text><text x="636" y="810" class="small">条件 KV cache + 多步 flow 更新 → 干净 latent</text><text x="636" y="834" class="small">冻结 VAE decode → 输出视频；无训练梯度</text></svg>
